<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Sarı taksi">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffc400" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset=".6" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a5c"/>
      <stop offset="1" stop-color="#151d26"/>
    </linearGradient>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#111"/>
      <rect x="10" y="10" width="10" height="10" fill="#111"/>
    </pattern>
  </defs>

  <rect width="600" height="420" fill="url(#sky)"/>
  <rect width="600" height="420" fill="url(#glow)"/>

  <!-- Şehir silüeti -->
  <g fill="#232327">
    <rect x="0" y="190" width="50" height="120"/>
    <rect x="55" y="150" width="40" height="160"/>
    <rect x="100" y="205" width="60" height="105"/>
    <rect x="165" y="130" width="36" height="180"/>
    <rect x="206" y="175" width="54" height="135"/>
    <path d="M270 310V190l30-40 30 40v120z"/>
    <rect x="338" y="160" width="44" height="150"/>
    <rect x="388" y="200" width="60" height="110"/>
    <rect x="454" y="140" width="38" height="170"/>
    <rect x="498" y="185" width="56" height="125"/>
    <rect x="558" y="165" width="42" height="145"/>
  </g>
  <g fill="#ffc400" opacity=".35">
    <rect x="65" y="165" width="6" height="8"/><rect x="80" y="185" width="6" height="8"/>
    <rect x="175" y="150" width="6" height="8"/><rect x="186" y="200" width="6" height="8"/>
    <rect x="348" y="178" width="6" height="8"/><rect x="364" y="210" width="6" height="8"/>
    <rect x="464" y="160" width="6" height="8"/><rect x="476" y="230" width="6" height="8"/>
    <rect x="568" y="185" width="6" height="8"/>
  </g>

  <!-- Yol -->
  <rect y="310" width="600" height="110" fill="#141416"/>
  <g fill="#ffc400" opacity=".7">
    <rect x="10" y="378" width="60" height="6" rx="3"/>
    <rect x="130" y="378" width="60" height="6" rx="3"/>
    <rect x="250" y="378" width="60" height="6" rx="3"/>
    <rect x="370" y="378" width="60" height="6" rx="3"/>
    <rect x="490" y="378" width="60" height="6" rx="3"/>
  </g>

  <!-- Taksi -->
  <g transform="translate(40 110)">
    <ellipse cx="262" cy="248" rx="232" ry="12" fill="#000" opacity=".55"/>

    <!-- Taksi lambası -->
    <rect x="232" y="44" width="84" height="28" rx="7" fill="#111"/>
    <text x="274" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffc400" letter-spacing="1">TAKSİ</text>

    <!-- Gövde -->
    <path d="M22 196c0-26 12-38 42-42l84-10 50-52c14-14 28-20 50-20h108c22 0 38 6 52 20l52 50 52 8c26 4 40 18 40 44v28c0 10-6 16-16 16H38c-10 0-16-6-16-16z" fill="url(#body)"/>

    <!-- Camlar -->
    <path d="M168 144l40-42c10-10 20-14 34-14h42v56z" fill="url(#glass)"/>
    <path d="M300 88h56c14 0 24 4 34 14l40 42H300z" fill="url(#glass)"/>
    <path d="M186 132l26-28 16 0-30 32z" fill="#fff" opacity=".12"/>
    <path d="M318 96h16l-18 40h-14z" fill="#fff" opacity=".1"/>

    <!-- Dama şerit -->
    <rect x="40" y="174" width="460" height="20" fill="url(#checker)"/>
    <rect x="40" y="174" width="460" height="20" fill="none" stroke="#111" stroke-width="2"/>

    <!-- Kapı çizgileri -->
    <path d="M292 88v152M168 150v90" stroke="#c99400" stroke-width="2.5"/>
    <rect x="236" y="158" width="26" height="6" rx="3" fill="#8a6600"/>
    <rect x="360" y="158" width="26" height="6" rx="3" fill="#8a6600"/>

    <!-- Farlar -->
    <rect x="518" y="168" width="18" height="16" rx="4" fill="#fff6cc"/>
    <path d="M536 170l60-12v38l-60-10z" fill="#fff6cc" opacity=".12"/>
    <rect x="22" y="168" width="10" height="18" rx="3" fill="#ff3b30"/>

    <!-- Tamponlar -->
    <rect x="18" y="222" width="40" height="12" rx="6" fill="#1a1a1a"/>
    <rect x="490" y="222" width="52" height="12" rx="6" fill="#1a1a1a"/>

    <!-- Tekerler -->
    <circle cx="130" cy="236" r="46" fill="#141416"/>
    <circle cx="420" cy="236" r="46" fill="#141416"/>
    <g>
      <circle cx="130" cy="236" r="36" fill="#0a0a0a"/>
      <circle cx="130" cy="236" r="19" fill="#9c9ca4"/>
      <circle cx="130" cy="236" r="7" fill="#3a3a40"/>
      <circle cx="420" cy="236" r="36" fill="#0a0a0a"/>
      <circle cx="420" cy="236" r="19" fill="#9c9ca4"/>
      <circle cx="420" cy="236" r="7" fill="#3a3a40"/>
    </g>
  </g>
</svg>
